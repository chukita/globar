name: CI

on:
  pull_request:
  push:
    branches: [main, test]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci exige que el lockfile esté generado con una versión de npm
      # compatible con la del runner (acá, npm 10.x vía node-version 22) —
      # con npm local más nuevo (11.x) tira "Missing: ... from lock file"
      # aunque el lockfile esté sano. npm install es más tolerante a eso.
      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # E2E con Playwright contra una base limpia: el webServer de
  # playwright.config.ts migra y siembra la base (e2e/prepare-db.mjs), compila
  # y levanta `next start`. Cubre alta de revendedores, webhooks de pago y
  # comisiones, liquidación y facturas, y permisos. La imagen y el deploy
  # dependen de que pasen.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: globar_e2e
          POSTGRES_USER: globar
          POSTGRES_PASSWORD: globar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://globar:globar@localhost:5432/globar_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # La VM de producción tiene 1GB de RAM — insuficiente para compilar la
  # imagen ahí (npm ci + next build se queda sin memoria). Por eso la imagen
  # se compila acá, en el runner de GitHub, y se sube ya lista a GHCR; la VM
  # solo hace `docker compose pull` (ver deploy/deploy.sh).
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main → :latest (producción), test → :test (ambiente de test, ver
      # deploy-test). La VM de cada ambiente elige su tag con IMAGE en su .env.
      - name: Build and push
        run: |
          TAG=${{ github.ref == 'refs/heads/main' && 'latest' || 'test' }}
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:${{ github.sha }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    # Un solo deploy a la vez sobre la VM: si se pushea de nuevo mientras uno
    # está corriendo, se cancela el viejo (siempre se despliega `latest`, así
    # que el que importa es el último). Evita que 2 `docker compose pull`
    # peleen por el lock del image store en una VM con 1GB de RAM.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          # La VM (1GB RAM) a veces tarda >10min en `docker compose pull` cuando
          # está bajo carga; con el default de 10min el paso corta a la mitad y
          # deja un pull huérfano que traba el siguiente deploy. deploy.sh mata
          # esos huérfanos al arrancar; acá le damos aire para que termine.
          command_timeout: 25m
          script: |
            cd ~/globar
            bash deploy/deploy.sh

  # Ambiente de test: VM aparte (globar-test, free tier de Oracle, mismo setup
  # que producción) en https://test.glob.ar, con su propia base. Se despliega
  # con cada push a la rama `test`; recién después se mergea a main.
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/test'
    concurrency:
      group: deploy-test
      cancel-in-progress: true
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Público por DNS (registro A en Cloudflare, sin proxy); la clave es
          # la misma que la de producción.
          host: test.glob.ar
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 25m
          script: |
            cd ~/globar
            bash deploy/deploy.sh
