# Producción: PostgreSQL + Next.js (app) + Caddy (TLS).
# Uso: copiá deploy/env.production.example a `.env` en la raíz del repo,
# completá valores, luego: docker compose -f docker-compose.prod.yml up -d
#
# La imagen de `app` NO se compila acá: la VM tiene 1GB de RAM, insuficiente
# para `next build`. Se compila en GitHub Actions y se sube a GHCR (ver
# .github/workflows/ci.yml); acá solo se hace `pull`. Primer login en la VM:
# docker login ghcr.io -u <tu-usuario-github> (con un PAT con scope read:packages).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globar}
      POSTGRES_USER: ${POSTGRES_USER:-globar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]

  # Backups automáticos de la base: pg_dump diario con rotación
  # (14 días / 8 semanas / 6 meses). Los .sql.gz quedan en ./backups del host.
  db_backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-globar}
      POSTGRES_USER: ${POSTGRES_USER:-globar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      POSTGRES_EXTRA_OPTS: '-Z6 --no-owner'
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

  app:
    image: ${IMAGE:-ghcr.io/chukita/globar:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: '3000'
      AUTH_TRUST_HOST: 'true'
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    networks: [app]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Definí PUBLIC_HOST en .env (FQDN, sin https://)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
