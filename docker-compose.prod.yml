# Producción: PostgreSQL + Next.js (app) + Caddy (TLS).
# Uso: copiá deploy/env.production.example a `.env` en la raíz del repo,
# completá valores, luego: docker compose -f docker-compose.prod.yml up -d
#
# La imagen de `app` NO se compila acá: la VM tiene 1GB de RAM, insuficiente
# para `next build`. Se compila en GitHub Actions y se sube a GHCR (ver
# .github/workflows/ci.yml); acá solo se hace `pull`. Primer login en la VM:
# docker login ghcr.io -u <tu-usuario-github> (con un PAT con scope read:packages).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globar}
      POSTGRES_USER: ${POSTGRES_USER:-globar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]

  # Backups automáticos de la base: pg_dump diario con rotación
  # (14 días / 8 semanas / 6 meses). Los .sql.gz quedan en ./backups del host.
  db_backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-globar}
      POSTGRES_USER: ${POSTGRES_USER:-globar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      POSTGRES_EXTRA_OPTS: '-Z6 --no-owner'
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

  # Copia off-site a Google Drive (rclone) de los dumps de la base Y de las
  # facturas/comprobantes subidos (volumen uploads, que db_backup no cubre).
  # Sin esto todo vive solo en el disco de la VM: si se pierde la instancia,
  # se pierden la base y sus backups juntos.
  # INACTIVO por defecto: solo arranca si en .env definís
  #   COMPOSE_PROFILES=backup-sync  y  RCLONE_GDRIVE_TOKEN=...
  # Cómo obtener el token y activarlo: ver docs/backups.md.
  # `copy` y no `sync`: nunca borra en Drive, así un dump rotado o una factura
  # reemplazada siguen estando allá.
  backup_sync:
    image: rclone/rclone:1.68
    profiles: [backup-sync]
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_TOKEN: ${RCLONE_GDRIVE_TOKEN:-}
      DEST: gdrive:${RCLONE_GDRIVE_FOLDER:-globar-backups}
      INTERVAL: ${BACKUP_SYNC_INTERVAL:-21600}
    volumes:
      - ./backups:/data/backups:ro
      - uploads:/data/uploads:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          echo "[backup_sync] copiando a Google Drive ($$DEST)..."
          ok=1
          rclone copy /data/backups "$$DEST/db" --copy-links --transfers 2 --retries 3 || ok=0
          rclone copy /data/uploads "$$DEST/uploads" --transfers 2 --retries 3 || ok=0
          if [ "$$ok" = 1 ]; then echo "[backup_sync] OK"; else echo "[backup_sync] ERROR en rclone (revisá RCLONE_GDRIVE_TOKEN)"; fi
          sleep "$$INTERVAL"
        done
    networks: [app]

  app:
    image: ${IMAGE:-ghcr.io/chukita/globar:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: '3000'
      AUTH_TRUST_HOST: 'true'
      # Next.js self-hosted no respeta X-Forwarded-Host/Proto de Caddy para construir
      # el redirect_uri de OAuth: sin esto, NextAuth arma https://localhost:3000/... y
      # Google lo rechaza (redirect_uri_mismatch).
      AUTH_URL: 'https://${PUBLIC_HOST}'
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    networks: [app]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Definí PUBLIC_HOST en .env (FQDN, sin https://)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
